# ===== Vinted — второй источник (своя дисциплина anti-ban) =====
# Категории и бренды на Vinted реально работают (attribute_ids), поэтому
# фильтр строгий. Город не ставим: Vinted везёт по всей Германии.
vinted:
  enabled: true
  domain: "https://www.vinted.de"
  per_page: 24
  max_requests_per_cycle: 6    # бережём: свой скользящий лимит и паузы
  max_requests_per_hour: 60
  searches:
    # Рабочие девайсы дешёвле рынка -> перепродажа (resale)
    - query: "iPhone 13"
      max_price_eur: 250
    - query: "iPhone 12"
      max_price_eur: 180
    - query: "MacBook Air"
      max_price_eur: 300
    - query: "MacBook Pro"
      max_price_eur: 400
    - query: "iPad"
      max_price_eur: 200
    - query: "ThinkPad"
      max_price_eur: 200
    - query: "Samsung Galaxy"
      max_price_eur: 200
    - query: "Google Pixel"
      max_price_eur: 180
    - query: "OnePlus"
      max_price_eur: 150
    # Приличное задешево: железо с хорошей видюхой по малой цене
    - query: "RTX 3060"
      max_price_eur: 200
    - query: "Gaming Laptop"
      max_price_eur: 250
    - query: "Gaming PC"
      max_price_eur: 250
    - query: "OLED TV"
      max_price_eur: 150
    - query: "Monitor"
      max_price_eur: 100
    - query: "Nintendo Switch"
      max_price_eur: 100
    - query: "PlayStation"
      max_price_eur: 150
    - query: "Xbox"
      max_price_eur: 100
    # Ремонтные углы (на Vinted их меньше, но бывают)
    - query: "defekt Bastler"
      max_price_eur: 80
    - query: "reparieren"
      max_price_eur: 60

# ===== Анализатор (LLM) =====
analyzer:
  provider: groq             # local | groq | openrouter | cerebras | together
  model: "qwen/qwen3.8-27b"
  base_url: "https://api.groq.com/openai/v1"
  api_key: ""                # лучше через .env: GROQ_API_KEY или FLIPPER_LLM_API_KEY
  api_key_env: "GROQ_API_KEY"
  fallback_local: true       # API упал/лимит -> считаем локальной моделью
  local_model: "qwen3:8b"    # локальный фолбэк (можно qwen3:14b)
  temperature: 0.1
  timeout_sec: 60
  retries: 3
  min_confidence: 0.7
  ollama_base_url: "http://localhost:11434"

# ===== Условия сделки =====
deal:
  min_margin_eur: 40         # порог для TAKE (ремонт)
  min_margin_pct: 35
  min_margin_eur_resale: 35  # порог для TAKE (перепродажа как есть) — ловим
  min_margin_pct_resale: 35  # и низкобюджетные флипы (контроллеры, мелочь)
  logistics_eur: 5           # затраты на доставку при перепродаже
  notify_only_verdicts: ["TAKE"]
  market_factor: 0.88        # медиана цен объявлений x 0.88 (VB/торг)
  price_cache_days: 7
  min_price_samples: 3       # меньше - верить оценке модели

# ===== REST API =====
api:
  api_key: ""                # заполняется из .env (FLIPPER_API_KEY)

# ===== БД =====
db:
  url: "sqlite:////home/prizrak/Work/flipper/backend/flipper.db"

# ===== Push (Phase B): путь к service-account.json или FLIPPER_FCM_SERVICE_ACCOUNT =====
notify:
  fcm_service_account: ""
  heartbeat_interval_min: 180   # каждые N минут шлём краткий статус (0 = выключено)
  price_drop_pct: 15            # % падения цены на уведомлённом лоте -> повторный алерт