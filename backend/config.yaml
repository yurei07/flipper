# ===== Скрейпер =====
scraper:
  poll_interval_min: 15      # цикл каждые 15 мин (в активном окне)
  # --- Режим «работа/отдых»: бережём аккаунт от бана ---
  active_minutes: 150        # 2.5 часа активной работы подряд
  rest_minutes: 30           # затем 30 минут полного отдыха (API не трогаем)
  max_requests_per_hour: 70  # жёсткий часовой потолок запросов к Kleinanzeigen
  searches_per_cycle: 8      # за цикл обходим 8 ниш (ротация) — нагрузка та же, охват шире
  pages_per_search: 1        # Фленсбург±15 км — результата не слишком много, хватает страницы
  detail_delay_sec: [2, 6]   # пауза между запросами детальных страниц (рандом)
  # --- Бюджет запросов за один цикл (защита от бана, §2) ---
  max_requests_per_cycle: 30 # общий лимит, дальше цикл заканчивается
  analyze_per_cycle: 4       # сколько объявлений анализировать за цикл (лимит TPM Groq)
  enrich_per_cycle: 3        # сколько деталей добирать за цикл
  # --- Широкие ниши: и "чинится легко", и "рабочее по капейкам" ---
  # LLM сам решает flip_type (ремонт vs перепродажа) по описанию.
  # category_ids — узкая категория Kleinanzeigen (ID из каталога библиотеки):
  #   173 Handy & Telefon | 278 Notebooks | 285 Tablets & Reader
  #   225 PC-Zubehör & Software | 279 Konsolen | 176 Haushaltsgeräte
  #   245 Foto | 172 Audio & Hifi
  searches:
    # Дефектное, но с дешёвым ремонтом (дисплей/аккумулятор/чистка)
    - query: "iPhone defekt"
      max_price_eur: 80
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
    - query: "MacBook defekt"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
    - query: "Laptop defekt"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
    - query: "Tablet defekt"
      max_price_eur: 60
      radius_km: 15
      location: "Flensburg"
      category_ids: [285]
    - query: "Drucker defekt"
      max_price_eur: 40
      radius_km: 15
      location: "Flensburg"
      category_ids: [225]
    - query: "Kaffeevollautomat defekt"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [176]
    # Рабочее по капейкам -> перепродажа как есть. Свежие первыми: ловим
    # недооценённые лоты в момент появления, а не вечные аксессуары по 5€.
    - query: "iPhone"
      max_price_eur: 120
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
    - query: "MacBook"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
    - query: "iPad"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [285]
    - query: "Laptop"
      max_price_eur: 120
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
    - query: "Grafikkarte"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [225]
    - query: "PlayStation Konsole"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [279]
    # --- Фото и аудио: линзы/камеры/усилители держат цену, часто чинятся ---
    - query: "Kamera defekt"
      max_price_eur: 60
      radius_km: 15
      location: "Flensburg"
      category_ids: [245]
    - query: "Kamera"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [245]
    - query: "Verstärker"
      max_price_eur: 80
      radius_km: 15
      location: "Flensburg"
      category_ids: [172]
    - query: "Lautsprecher defekt"
      max_price_eur: 40
      radius_km: 15
      location: "Flensburg"
      category_ids: [172]
    # --- Catch-all «defekt»: любой бренд, всего поломанного в радиусе ---
    # Проверено: API игнорирует category_ids для строкового запроса
    # (все категории возвращают один набор), поэтому категории не задаём —
    # один поиск покрывает весь сайт, а лишние дубли лишь жгут часовой лимит.
    - query: "defekt"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
    # --- Бренды/устройства с быстрым оборотом ---
    - query: "Samsung Galaxy defekt"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
    - query: "AirPods defekt"
      max_price_eur: 40
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
    - query: "iMac"
      radius_km: 15
      location: "Flensburg"
      category_ids: [228]
      max_price_eur: 150
    - query: "ThinkPad"
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
      max_price_eur: 120
    - query: "Apple Watch"
      radius_km: 15
      location: "Flensburg"
      max_price_eur: 80
    - query: "Nintendo Switch"
      radius_km: 15
      location: "Flensburg"
      category_ids: [279]
      max_price_eur: 80
    - query: "Xbox"
      radius_km: 15
      location: "Flensburg"
      category_ids: [279]
      max_price_eur: 100
    - query: "Drohne defekt"
      radius_km: 15
      location: "Flensburg"
      max_price_eur: 80
  # Титулы/описания с этими словами - отбрасывать (клиентский фильтр)
  exclude_keywords:
    - "abholung nur"
  # Только по заголовку: аксессуары, а не техника (чехлы/плёнки/кабели)
  exclude_title_keywords:
    - "hülle"
    - "panzerglas"
    - "displayschutz"
    - "displayfolie"
    - "schutzhülle"
    - "ohne smartphone"
    - "nur verpackung"
    - "ovp ohne"
    - "handyhülle"
    - "tasche"
    - "case"
    - "cover"
    - "kabel"
    - "ladegerät"
    - "ladekabel"
    - "netzteil"
    - "kissen"
    - "ständer"
    - "halterung"
    - "schutzglas"
    - "dock"
    - "pencil"
    - "tastatur"
    - "karton"
    - " leer"
    - "spiele"
    - "pullover"
    - "anleitung"

# ===== Анализатор (LLM) =====
analyzer:
  provider: groq             # local | groq | openrouter | cerebras | together
  model: "qwen/qwen3.8-27b"
  base_url: "https://api.groq.com/openai/v1"
  api_key: ""                # лучше через .env: GROQ_API_KEY или FLIPPER_LLM_API_KEY
  api_key_env: "GROQ_API_KEY"
  fallback_local: true       # API упал/лимит -> считаем локальной моделью
  local_model: "qwen3:8b"    # локальный фолбэк (можно qwen3:14b)
  temperature: 0.1
  timeout_sec: 60
  retries: 3
  min_confidence: 0.7
  ollama_base_url: "http://localhost:11434"

# ===== Условия сделки =====
deal:
  min_margin_eur: 40         # порог для TAKE (ремонт)
  min_margin_pct: 35
  min_margin_eur_resale: 35  # порог для TAKE (перепродажа как есть) — ловим
  min_margin_pct_resale: 35  # и низкобюджетные флипы (контроллеры, мелочь)
  logistics_eur: 5           # затраты на доставку при перепродаже
  notify_only_verdicts: ["TAKE"]
  market_factor: 0.88        # медиана цен объявлений x 0.88 (VB/торг)
  price_cache_days: 7
  min_price_samples: 3       # меньше - верить оценке модели

# ===== REST API =====
api:
  api_key: ""                # заполняется из .env (FLIPPER_API_KEY)

# ===== БД =====
db:
  url: "sqlite:////home/prizrak/Work/flipper/backend/flipper.db"

# ===== Push (Phase B): путь к service-account.json или FLIPPER_FCM_SERVICE_ACCOUNT =====
notify:
  fcm_service_account: ""
  heartbeat_interval_min: 180   # каждые N минут шлём краткий статус (0 = выключено)