# ===== Скрейпер =====
scraper:
  poll_interval_min: 15      # цикл каждые 15 мин (в активном окне)
  # --- Режим «работа/отдых»: бережём аккаунт от бана ---
  active_minutes: 150        # 2.5 часа активной работы подряд
  rest_minutes: 30           # затем 30 минут полного отдыха (API не трогаем)
  max_requests_per_hour: 70  # жёсткий часовой потолок запросов к Kleinanzeigen
  searches_per_cycle: 8      # за цикл обходим 8 ниш (ротация) — нагрузка та же, охват шире
  pages_per_search: 1        # Фленсбург±15 км — результата не слишком много, хватает страницы
  detail_delay_sec: [2, 6]   # пауза между запросами детальных страниц (рандом)
  # --- Бюджет запросов за один цикл (защита от бана, §2) ---
  max_requests_per_cycle: 30 # общий лимит, дальше цикл заканчивается
  analyze_per_cycle: 4       # сколько объявлений анализировать за цикл (лимит TPM Groq)
  enrich_per_cycle: 3        # сколько деталей добирать за цикл
  # MAYBE-лоты старше N дней пересматриваем заново (цена могла упасть -> TAKE),
  # по reanalyze_maybe_per_cycle штук за цикл, чтобы не жечь TPM.
  reanalyze_maybe_days: 3
  reanalyze_maybe_per_cycle: 2
  # --- Широкие ниши: и "чинится легко", и "рабочее по капейкам" ---
  # LLM сам решает flip_type (ремонт vs перепродажа) по описанию.
  # category_ids — узкая категория Kleinanzeigen (ID из каталога библиотеки):
  #   173 Handy & Telefon | 278 Notebooks | 285 Tablets & Reader
  #   225 PC-Zubehör & Software | 279 Konsolen | 176 Haushaltsgeräte
  #   245 Foto | 172 Audio & Hifi
  searches:
    # Дефектное, но с дешёвым ремонтом (дисплей/аккумулятор/чистка)
    - query: "iPhone defekt"
      max_price_eur: 80
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
    - query: "MacBook defekt"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
    - query: "Laptop defekt"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
    - query: "Tablet defekt"
      max_price_eur: 60
      radius_km: 15
      location: "Flensburg"
      category_ids: [285]
    - query: "Drucker defekt"
      max_price_eur: 40
      radius_km: 15
      location: "Flensburg"
      category_ids: [225]
    - query: "Kaffeevollautomat defekt"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [176]
    # Рабочее по капейкам -> перепродажа как есть. Свежие первыми: ловим
    # недооценённые лоты в момент появления, а не вечные аксессуары по 5€.
    # sort_price ASCENDING — самые дешёвые (недооценённые) показываются первыми.
    - query: "iPhone"
      max_price_eur: 200
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
      sort_price: "ASCENDING"
    - query: "MacBook"
      max_price_eur: 250
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
      sort_price: "ASCENDING"
    - query: "iPad"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [285]
      sort_price: "ASCENDING"
    - query: "iMac"
      radius_km: 15
      location: "Flensburg"
      category_ids: [228]
      max_price_eur: 250
      sort_price: "ASCENDING"
    - query: "ThinkPad"
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
      max_price_eur: 200
      sort_price: "ASCENDING"
    - query: "Samsung Galaxy"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
      sort_price: "ASCENDING"
    - query: "Google Pixel"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
      sort_price: "ASCENDING"
    - query: "OnePlus"
      max_price_eur: 120
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
      sort_price: "ASCENDING"
    - query: "Lenovo"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
      sort_price: "ASCENDING"
    - query: "Monitor"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [225]
      sort_price: "ASCENDING"
    - query: "Fernseher"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [168]
      sort_price: "ASCENDING"
    - query: "Laptop"
      max_price_eur: 120
      radius_km: 15
      location: "Flensburg"
      category_ids: [278]
    - query: "Grafikkarte"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
      category_ids: [225]
    - query: "PlayStation Konsole"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [279]
    # --- Фото и аудио: линзы/камеры/усилители держат цену, часто чинятся ---
    - query: "Kamera defekt"
      max_price_eur: 60
      radius_km: 15
      location: "Flensburg"
      category_ids: [245]
    - query: "Kamera"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [245]
    - query: "Verstärker"
      max_price_eur: 80
      radius_km: 15
      location: "Flensburg"
      category_ids: [172]
    - query: "Lautsprecher defekt"
      max_price_eur: 40
      radius_km: 15
      location: "Flensburg"
      category_ids: [172]
    # --- Catch-all «defekt»: любой бренд, всего поломанного в радиусе ---
    # Проверено: API игнорирует category_ids для строкового запроса
    # (все категории возвращают один набор), поэтому категории не задаём —
    # один поиск покрывает весь сайт, а лишние дубли лишь жгут часовой лимит.
    - query: "defekt"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
    # --- Бренды/устройства с быстрым оборотом ---
    - query: "Samsung Galaxy defekt"
      max_price_eur: 100
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
    - query: "AirPods defekt"
      max_price_eur: 40
      radius_km: 15
      location: "Flensburg"
      category_ids: [173]
    - query: "Apple Watch"
      radius_km: 15
      location: "Flensburg"
      max_price_eur: 80
    - query: "Nintendo Switch"
      radius_km: 15
      location: "Flensburg"
      category_ids: [279]
      max_price_eur: 80
    - query: "Xbox"
      radius_km: 15
      location: "Flensburg"
      category_ids: [279]
      max_price_eur: 100
    - query: "Drohne defekt"
      radius_km: 15
      location: "Flensburg"
      max_price_eur: 80
    # --- «Хорошая вещь за малую цену»: железо дороже запрошенного порога ---
    - query: "iPhone 13"
      max_price_eur: 350
      radius_km: 15
      location: "Flensburg"
    - query: "iPhone 14"
      max_price_eur: 450
      radius_km: 15
      location: "Flensburg"
    - query: "MacBook Pro"
      max_price_eur: 350
      radius_km: 15
      location: "Flensburg"
    - query: "RTX"
      max_price_eur: 300
      radius_km: 15
      location: "Flensburg"
    - query: "Gaming Laptop"
      max_price_eur: 250
      radius_km: 15
      location: "Flensburg"
    - query: "Gaming PC"
      max_price_eur: 250
      radius_km: 15
      location: "Flensburg"
    - query: "OLED"
      max_price_eur: 200
      radius_km: 15
      location: "Flensburg"
    - query: "DJI"
      max_price_eur: 150
      radius_km: 15
      location: "Flensburg"
    - query: "GoPro"
      max_price_eur: 120
      radius_km: 15
      location: "Flensburg"
  # Титулы/описания с этими словами - отбрасывать (клиентский фильтр)
  # Catch-all «defekt» тянет весь сайт (API игнорирует категории для строковых
  # запросов) — этим фильтром отсекаем заведомо не-технику: велосипеды/мебель/
  # детское/одежда/авто-хлам, чтобы не жечь анализ на велосипед.
