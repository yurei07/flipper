[project]
name = "flipper"
version = "0.1.0"
description = "Kleinanzeigen deal scanner: scraper + LLM analyzer + pricing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "kleinanzeigen-api>=0.4.0",
    "vinted-scraper>=5.0.0",
    "firebase-admin>=6.5",
    "pywebpush>=2.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
]

[project.scripts]
flipper = "flipper.cli:main"
flipper-cli = "flipper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["flipper*"]

[tool.pytest.ini_options]
markers = ["live: marks integration tests that hit the network"]
testpaths = ["tests"]