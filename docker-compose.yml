services:
  backend:
    build: ./backend
    container_name: flipper-backend
    volumes:
      - ./backend:/app
    env_file:
      - path: .env
        required: false
    # host-сеть: скрейпер выходит с домашнего IP (§2.4) и видит Ollama на localhost:11434.
    # Порты в этом режиме не пробрасываются — backend слушает 8000 на хосте напрямую.
    network_mode: host
    restart: unless-stopped
    command: >
      sh -c "uvicorn flipper.app.main:app
             --host 0.0.0.0 --port 8000"

  # Ollama живёт отдельно на хосте (родным инсталлятором), не в compose

